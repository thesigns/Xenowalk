<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="glutta-banker-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8e986" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#b8e986" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#b8e986" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="glutta-banker-glass" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffd479" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffd479" stop-opacity="0.08"/>
    </radialGradient>
    <!-- Fat grub body: four swelling segments, the last sunk into the hoard -->
    <path id="glutta-banker-body" d="M100 456 C82 420 86 374 128 360 C100 344 104 294 160 280 C136 264 146 222 198 212 C176 196 174 124 222 102 C248 90 296 90 322 104 C362 126 362 196 334 214 C378 226 384 268 358 284 C404 298 404 348 378 362 C422 376 428 420 412 456"/>
    <path id="glutta-banker-tail" d="M462 470 C478 440 484 414 468 390 C458 376 440 374 432 384 C428 390 432 396 438 394 C446 392 452 398 450 410 C446 428 426 446 406 462"/>
    <!-- Hexagonal credit chips: one lying flat, one standing on edge -->
    <path id="glutta-banker-flat" d="M-18 0 L-9 -7 H9 L18 0 L9 7 H-9 Z M-18 0 V5 L-9 12 H9 L18 5 V0"/>
    <path id="glutta-banker-chip" d="M0 -15 L13 -7.5 V7.5 L0 15 L-13 7.5 V-7.5 Z M0 -7 L6 -3.5 V3.5 L0 7 L-6 3.5 V-3.5 Z"/>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body silhouette -->
    <use href="#glutta-banker-body" fill="#0a101b" fill-opacity="0.6"/>
    <use href="#glutta-banker-body" fill="url(#glutta-banker-skin)" stroke="#e9f2ff" stroke-width="4"/>
    <!-- Segment folds -->
    <path d="M198 212 C232 232 300 234 334 214 M160 280 C208 306 310 310 358 284 M128 360 C184 392 322 394 378 362" stroke="#e9f2ff" stroke-width="3"/>
    <path d="M208 222 C240 238 294 240 324 224 M172 290 C214 314 304 318 346 294 M142 370 C192 400 314 402 364 372" stroke="#b8e986" stroke-width="1.5" opacity="0.45"/>
    <!-- Glistening shine on each fat roll -->
    <path d="M200 140 C204 122 214 110 228 104 M160 248 C162 236 170 226 182 222 M124 330 C126 314 136 302 152 296 M106 418 C106 398 116 384 134 376" stroke="#e9f2ff" stroke-width="3" opacity="0.85"/>
    <path d="M194 154 V162 M152 258 V264 M118 342 V348 M98 430 V436" stroke="#e9f2ff" stroke-width="3" opacity="0.6"/>
    <path d="M342 146 C344 166 340 186 330 200 M362 240 C366 256 362 268 352 276 M378 316 C382 332 378 346 368 354 M410 398 C414 418 410 434 402 446" stroke="#b8e986" stroke-width="2" opacity="0.7"/>
    <!-- Breathing pores along the flanks -->
    <circle cx="152" cy="336" r="4" stroke="#b8e986" stroke-width="1.5" opacity="0.7"/>
    <circle cx="368" cy="336" r="4" stroke="#b8e986" stroke-width="1.5" opacity="0.7"/>
    <circle cx="122" cy="414" r="4.5" stroke="#b8e986" stroke-width="1.5" opacity="0.7"/>
    <circle cx="390" cy="414" r="4.5" stroke="#b8e986" stroke-width="1.5" opacity="0.7"/>
    <!-- Tiny useless legs -->
    <path d="M112 320 L98 326 L100 336 M110 340 L98 348 L102 358 M393 320 L407 326 L405 336 M395 340 L407 348 L403 358" stroke="#9fb1c8" stroke-width="2.5"/>
    <!-- Chain of office with a hexagonal medallion -->
    <path d="M154 250 C194 288 322 290 362 254" stroke="#ffd479" stroke-width="4" stroke-dasharray="0.1 9"/>
    <path d="M256 276 L270 284 V300 L256 308 L242 300 V284 Z" fill="#0a101b" fill-opacity="0.6" stroke="#ffd479" stroke-width="2.5"/>
    <path d="M256 284 L263 288 V296 L256 300 L249 296 V288 Z" fill="#ffd479" fill-opacity="0.45" stroke="none"/>
    <!-- Puffed cheeks -->
    <path d="M212 166 C216 184 226 196 238 202 M330 164 C326 182 316 194 304 200" stroke="#9fb1c8" stroke-width="1.5"/>
    <!-- Tiny smug eyes under heavy lids -->
    <path d="M236 145 C242 139 254 139 260 145 M278 145 C284 139 296 139 302 145" stroke="#e9f2ff" stroke-width="3"/>
    <ellipse cx="248" cy="149" rx="5" ry="3" fill="#b8e986" fill-opacity="0.6" stroke="#b8e986" stroke-width="1.5"/>
    <ellipse cx="290" cy="149" rx="5" ry="3" fill="#b8e986" fill-opacity="0.6" stroke="#b8e986" stroke-width="1.5"/>
    <!-- Monocle on a fine chain down to the chain of office -->
    <circle cx="290" cy="149" r="17" fill="url(#glutta-banker-glass)" stroke="#ffd479" stroke-width="3"/>
    <path d="M280 138 C283 135 287 134 291 134" stroke="#e9f2ff" stroke-width="1.5" opacity="0.8"/>
    <path d="M304 160 C324 186 336 216 344 262" stroke="#ffd479" stroke-width="2" stroke-dasharray="0.1 5"/>
    <!-- Wide satisfied smile full of needle teeth, a double chin, a bead of drool -->
    <path d="M242 176 C258 194 290 194 310 172 C292 184 260 186 242 176 Z" fill="#0a101b" fill-opacity="0.6" stroke="#e9f2ff" stroke-width="2.5"/>
    <path d="M256 183 L258 188 M266 186 L267 191 M276 186 L276 191 M286 185 L285 190 M296 181 L294 186" stroke="#9fb1c8" stroke-width="1.5"/>
    <path d="M238 202 C258 212 290 212 314 198" stroke="#9fb1c8" stroke-width="1.5"/>
    <path d="M244 180 C241 188 241 194 244 197 C247 194 247 188 244 180 Z" fill="#b8e986" fill-opacity="0.3" stroke="#b8e986" stroke-width="1.5"/>
    <!-- Tail curling out of the hoard (left open at the base, under the chips) -->
    <use href="#glutta-banker-tail" fill="#0a101b" fill-opacity="0.6"/>
    <use href="#glutta-banker-tail" fill="url(#glutta-banker-skin)" stroke="#e9f2ff" stroke-width="3.5"/>
    <path d="M424 456 C438 462 458 460 474 450 M444 428 C456 432 470 430 480 422" stroke="#e9f2ff" stroke-width="2"/>
    <path d="M466 398 C472 408 476 420 476 432" stroke="#b8e986" stroke-width="2" opacity="0.7"/>
    <!-- Heap of credit chips -->
    <path d="M10 520 C26 478 70 450 128 448 C180 446 214 438 256 440 C300 442 336 448 384 452 C436 458 482 482 502 520 Z" fill="#0a101b" fill-opacity="0.6" stroke="#e9f2ff" stroke-width="4"/>
    <path d="M10 520 C26 478 70 450 128 448 C180 446 214 438 256 440 C300 442 336 448 384 452 C436 458 482 482 502 520 Z" fill="#ffd479" fill-opacity="0.06" stroke="none"/>
    <g stroke="#ffd479" stroke-width="2" fill="#ffd479" fill-opacity="0.12">
      <!-- Stack at the left -->
      <use href="#glutta-banker-flat" transform="translate(72 470)"/>
      <use href="#glutta-banker-flat" transform="translate(74 458)"/>
      <use href="#glutta-banker-flat" transform="translate(71 446)"/>
      <use href="#glutta-banker-flat" transform="translate(75 434)"/>
      <!-- Loose chips on the heap -->
      <use href="#glutta-banker-flat" transform="translate(150 444)"/>
      <use href="#glutta-banker-flat" transform="translate(206 456) rotate(-8)"/>
      <use href="#glutta-banker-flat" transform="translate(300 448) rotate(6)"/>
      <use href="#glutta-banker-flat" transform="translate(366 462)"/>
      <use href="#glutta-banker-flat" transform="translate(120 488) rotate(4)"/>
      <use href="#glutta-banker-flat" transform="translate(330 492) rotate(-5)"/>
      <use href="#glutta-banker-flat" transform="translate(430 500)"/>
      <use href="#glutta-banker-chip" transform="translate(256 474) rotate(10)" fill-opacity="0.25" stroke-width="2.5"/>
      <use href="#glutta-banker-chip" transform="translate(176 492) rotate(-24)"/>
      <use href="#glutta-banker-chip" transform="translate(392 490) rotate(18)"/>
    </g>
    <!-- Glints -->
    <path d="M40 404 L43 414 L53 417 L43 420 L40 430 L37 420 L27 417 L37 414 Z M302 424 L304 431 L311 433 L304 435 L302 442 L300 435 L293 433 L300 431 Z M494 446 L496 452 L502 454 L496 456 L494 462 L492 456 L486 454 L492 452 Z" fill="#ffd479" fill-opacity="0.6" stroke="none"/>
  </g>
</svg>
