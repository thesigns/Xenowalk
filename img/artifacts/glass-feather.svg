    <path d="M358 228 L364 220 L370 228 L364 236 Z" fill="#8fe9ff" fill-opacity="0.2" stroke="#8fe9ff" stroke-width="1.5" opacity="0.7"/>
    <path d="M200 252 L206 244 L212 252 L206 260 Z" fill="#8fe9ff" fill-opacity="0.2" stroke="#8fe9ff" stroke-width="1.5" opacity="0.6"/>
