    <path d="M254 384 C238 380 226 386 218 398 M254 394 C240 396 232 406 228 418 M257 384 C274 378 288 384 296 396 M257 394 C272 396 280 406 282 418" stroke="#8fe9ff" stroke-width="1.5" opacity="0.6"/>
