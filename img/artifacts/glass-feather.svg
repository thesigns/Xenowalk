  <defs>
    <linearGradient id="glass-feather-vane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fe9ff" stop-opacity="0.1"/>
      <stop offset="0.45" stop-color="#8fe9ff" stop-opacity="0.08"/>
