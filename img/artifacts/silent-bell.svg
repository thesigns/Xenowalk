    <path d="M208 150 C208 126 228 116 256 116 C284 116 304 126 304 150 C306 214 318 282 344 330 C352 344 364 352 378 356 L378 360 C354 378 158 378 134 360 L134 356 C148 352 160 344 168 330 C194 282 206 214 208 150 Z" fill="url(#silent-bell-bronze)" stroke="#e9f2ff" stroke-width="4"/>
