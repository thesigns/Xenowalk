<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="funeral-barge-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b3a6d9" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#b3a6d9" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Still water of the void -->
    <path d="M124 372 H388" stroke="#b3a6d9" stroke-width="2" opacity="0.6"/>
    <path d="M172 396 H340" stroke="#b3a6d9" stroke-width="1.5" opacity="0.35"/>
    <!-- Canopy over the dead -->
    <path d="M178 294 V184 M334 294 V184" stroke="#9fb1c8" stroke-width="3"/>
    <path d="M160 184 H352 M172 170 H340" stroke="#e9f2ff" stroke-width="4"/>
    <!-- Sarcophagus -->
    <path d="M198 294 L206 250 H306 L314 294 Z" fill="#b3a6d9" fill-opacity="0.2" stroke="#e9f2ff" stroke-width="4"/>
    <path d="M202 250 L216 234 H296 L310 250" stroke="#9fb1c8" stroke-width="2"/>
    <path d="M256 260 L260 270 L270 274 L260 278 L256 288 L252 278 L242 274 L252 270 Z" fill="#b3a6d9" fill-opacity="0.3" stroke="#b3a6d9" stroke-width="1.5"/>
    <!-- Hull: a crescent of carved stone -->
    <path d="M84 206 C92 262 120 306 160 324 C206 344 306 344 352 324 C392 306 420 262 428 206 L414 214 C404 254 384 282 356 294 H156 C128 282 108 254 98 214 Z" fill="url(#funeral-barge-hull)" stroke="#e9f2ff" stroke-width="4"/>
    <path d="M150 306 C200 326 312 326 362 306" stroke="#9fb1c8" stroke-width="2" opacity="0.7"/>
    <path d="M226 334 V320 M256 336 V322 M286 334 V320" stroke="#b3a6d9" stroke-width="1.5" opacity="0.6"/>
    <!-- Prow finials -->
    <circle cx="90" cy="200" r="7" fill="#b3a6d9" fill-opacity="0.3" stroke="#b3a6d9" stroke-width="2"/>
    <circle cx="422" cy="200" r="7" fill="#b3a6d9" fill-opacity="0.3" stroke="#b3a6d9" stroke-width="2"/>
    <!-- The black star it sails toward -->
    <path d="M256 98 L263 122 L286 130 L263 138 L256 162 L249 138 L226 130 L249 122 Z" fill="#b3a6d9" fill-opacity="0.25" stroke="#b3a6d9" stroke-width="2.5"/>
    <circle cx="256" cy="130" r="3.5" fill="#e9f2ff" stroke="none"/>
  </g>
