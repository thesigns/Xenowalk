    <path d="M248 154 H264 V372 H248 Z" fill="#7aa2ff" fill-opacity="0.16" stroke="#e9f2ff" stroke-width="4"/>
    <path d="M196 412 L222 372 H290 L316 412 Z" fill="#7aa2ff" fill-opacity="0.2" stroke="#e9f2ff" stroke-width="4"/>
    <!-- Beam, graduated -->
    <path d="M116 140 H396 V154 H116 Z" fill="#7aa2ff" fill-opacity="0.2" stroke="#e9f2ff" stroke-width="4"/>
    <path d="M136 132 V140 M166 132 V140 M196 132 V140 M226 132 V140 M286 132 V140 M316 132 V140 M346 132 V140 M376 132 V140" stroke="#9fb1c8" stroke-width="1.5"/>
    <circle cx="256" cy="147" r="5" fill="#e9f2ff" stroke="none"/>
    <!-- Cords -->
    <path d="M146 154 L90 300 M146 154 L202 300 M366 154 L310 300 M366 154 L422 300" stroke="#9fb1c8" stroke-width="2"/>
    <!-- Left pan: every number, stacked four, three, two, one -->
