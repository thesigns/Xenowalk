    <path d="M122 288 h0.1 M138 288 h0.1 M154 288 h0.1 M170 288 h0.1 M130 273 h0.1 M146 273 h0.1 M162 273 h0.1 M138 258 h0.1 M154 258 h0.1 M146 243 h0.1" stroke="#7aa2ff" stroke-width="10"/>
    <!-- Right pan: nothing, and the beam stays level -->
    <path d="M304 300 H428 C422 324 400 334 366 334 C332 334 310 324 304 300 Z" fill="url(#last-equation-pan)" stroke="#e9f2ff" stroke-width="4"/>
    <circle cx="366" cy="284" r="13" stroke="#7aa2ff" stroke-width="3"/>
  </g>
</svg>
