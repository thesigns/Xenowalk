      <stop offset="0" stop-color="#7aa2ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7aa2ff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Level gauge: the needle has not moved -->
    <path d="M220 124 Q256 100 292 124" stroke="#7aa2ff" stroke-width="2"/>
    <path d="M238 116 L236 110 M274 116 L276 110" stroke="#7aa2ff" stroke-width="1.5" opacity="0.6"/>
