    <path d="M204 178 C168 192 148 236 152 284 C156 338 204 388 262 416 C292 404 344 364 362 314 C380 266 372 212 334 190 C314 180 292 182 278 192 C262 180 230 170 204 178 Z" fill="url(#amber-heart-core)" stroke="#e9f2ff" stroke-width="4"/>
