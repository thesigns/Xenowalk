      <stop offset="0" stop-color="#6dffa8" stop-opacity="0.36"/>
      <stop offset="0.6" stop-color="#6dffa8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6dffa8" stop-opacity="0.06"/>
    </radialGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
