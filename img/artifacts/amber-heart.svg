      <circle cx="320" cy="250" r="4"/>
      <circle cx="226" cy="372" r="3.5"/>
      <circle cx="334" cy="340" r="3"/>
    </g>
    <circle cx="282" cy="318" r="16" fill="#6dffa8" fill-opacity="0.3" stroke="#6dffa8" stroke-width="2.5"/>
    <circle cx="282" cy="318" r="5" fill="#e9f2ff" stroke="none"/>
