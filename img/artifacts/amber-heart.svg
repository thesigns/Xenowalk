    <path d="M236 198 C232 150 240 116 278 110 C316 104 346 126 346 164 V184 H316 V166 C316 154 304 146 292 146 C278 146 270 160 270 198 Q253 204 236 198 Z" fill="#6dffa8" fill-opacity="0.2" stroke="#e9f2ff" stroke-width="4"/>
    <!-- Pulmonary trunk -->
    <path d="M204 222 C196 196 186 176 168 160 L190 140 C206 158 222 184 232 214 Q218 226 204 222 Z" fill="#6dffa8" fill-opacity="0.2" stroke="#e9f2ff" stroke-width="4"/>
    <ellipse cx="179" cy="150" rx="15" ry="6" transform="rotate(-42 179 150)" fill="#6dffa8" fill-opacity="0.3" stroke="#6dffa8" stroke-width="2"/>
