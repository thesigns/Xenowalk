    <path d="M172 140 L240 256 M193 140 L244 256 M214 140 L248 256 M235 140 L252 256 M256 140 V256 M277 140 L260 256 M298 140 L264 256 M319 140 L268 256 M340 140 L272 256" stroke="#7aa2ff" stroke-width="1.5" opacity="0.5"/>
