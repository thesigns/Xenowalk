<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Xenowalk on a phone</title>
  <style>
    /* A desktop preview of the game at phone sizes, for development. */
    body { margin: 0; min-height: 100vh; display: flex; gap: 32px; align-items: center; justify-content: center; background: #1b1f27; font: 13px system-ui, sans-serif; color: #9aa6b8; }
    figure { margin: 0; display: grid; gap: 8px; justify-items: center; }
    iframe { border: 10px solid #000; border-radius: 36px; background: #000; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); }
  </style>
</head>
<body>
  <figure>
    <iframe id="phone" src="../?debug" width="390" height="740" allow="geolocation; vibrate"></iframe>
    <figcaption>390 × 740 · <a href="../?debug" style="color:#5fe6ff">open full</a></figcaption>
  </figure>
</body>
</html>
